services:
  - type: web
    name: atcoder-tagged-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run init:db
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: "*"
